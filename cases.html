<script>
/* 案例页：渲染筛选按钮和案例卡片 */
document.addEventListener('DOMContentLoaded', function() {
    /* 渲染筛选按钮 */
    var filterBar = document.getElementById('case-filter-bar');
    var filterContainer = filterBar.querySelector('.container');

    var filterHtml = '';
    CASE_CATEGORIES.forEach(function(cat, idx) {
        filterHtml += '<button class="filter-btn' + (idx === 0 ? ' active' : '') + '" data-filter="' + cat.id + '">' + cat.label + '</button>';
    });
    filterContainer.innerHTML = filterHtml;

    /* 重新绑定筛选功能 */
    if (typeof initFilterBar === 'function') initFilterBar();

    /* 渲染案例卡片 */
    var grid = document.getElementById('cases-grid');
    var iconMap = {
        '科技': '💻', '体育': '⚽', '汽车': '🚗', '消费品': '📦',
        '医疗': '🏥', '教育': '📚', '政府/协会': '🏛️'
    };

    var html = '';
    CASE_DATA.forEach(function(c) {
        var icon = iconMap[c.category] || '🏢';
        var firstTag = c.tags[0] || '';
        html += '<div class="case-card fade-in" data-category="' + c.category + '">' +
            '<div class="case-img" style="cursor:default;">' +
                icon +
                '<span class="case-tag">' + firstTag + '</span>' +
            '</div>' +
            '<div class="case-body">' +
                '<h3>' + c.title + '</h3>' +
                '<div class="case-meta">' + c.location + ' · ' + c.area + ' · ' + c.year + '</div>' +
                '<p>' + c.desc.substring(0, 80) + '...</p>' +
                '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">' +
                    c.tags.map(function(t) {
                        return '<span style="background:var(--bg-gray);padding:2px 10px;border-radius:12px;font-size:12px;color:var(--text-light);">' + t + '</span>';
                    }).join('') +
                '</div>' +
            '</div>' +
        '</div>';
    });
    grid.innerHTML = html;

    /* 更新案例数量 */
    var countEl = document.getElementById('case-count');
    countEl.textContent = '共 ' + CASE_DATA.length + ' 个案例';

    /* 重新触发滚动动画 */
    if (typeof initScrollAnimations === 'function') initScrollAnimations();
});
</script>
