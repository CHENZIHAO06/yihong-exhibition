<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小艺 · 艺鸿智能助手</title>
    <style>
        /* ========== 全局重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f0f0;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== 设置页 ========== */
        #setupPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            background: linear-gradient(135deg, #0e2f44, #1a5276);
            color: white;
        }
        #setupPage.hidden { display: none; }
        .setup-logo {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .setup-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .setup-sub {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .setup-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            color: #333;
        }
        .setup-box label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 16px;
        }
        .setup-box label:first-child { margin-top: 0; }
        .setup-box input, .setup-box textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .setup-box input:focus, .setup-box textarea:focus {
            border-color: #2e86c1;
            box-shadow: 0 0 0 3px rgba(46,134,193,0.15);
        }
        .setup-box textarea { height: 100px; resize: vertical; font-size: 13px; }
        .setup-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        .setup-btn:active { opacity: 0.8; }
        .setup-tip {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 12px;
            line-height: 1.6;
        }
        .setup-tip a { color: #2e86c1; }

        /* ========== 聊天页 ========== */
        #chatPage { display: none; flex-direction: column; height: 100vh; }
        #chatPage.active { display: flex; }

        /* 顶部栏 */
        .chat-header {
            background: linear-gradient(135deg, #0e2f44, #1a5276);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-header .avatar {
            width: 40px; height: 40px;
            background: #e67e22;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .chat-header .info { flex: 1; }
        .chat-header .info h2 { font-size: 17px; font-weight: 600; }
        .chat-header .info p { font-size: 12px; opacity: 0.7; }
        .chat-header .settings-btn {
            background: none; border: none; color: white;
            font-size: 24px; cursor: pointer; padding: 4px;
        }

        /* 消息区 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot { align-self: flex-start; }

        .msg .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user .bubble {
            background: #2e86c1;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.bot .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .msg .avatar-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }
        .msg.user .avatar-icon { background: #1a5276; }
        .msg.bot .avatar-icon { background: #e67e22; }

        .typing .bubble {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 16px 20px;
        }
        .typing .dot {
            width: 8px; height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* 输入区 */
        .input-area {
            padding: 12px 14px;
            background: white;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            padding: 8px 0;
            max-height: 100px;
            resize: none;
            line-height: 1.5;
        }
        .input-area .send-btn {
            width: 44px; height: 44px;
            background: #2e86c1;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .input-area .send-btn:disabled { opacity: 0.4; }
        .input-area .send-btn:active { transform: scale(0.95); }

        /* ========== 文件上传 ========== */
        .upload-btn {
            width: 44px; height: 44px;
            background: none; border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .upload-btn:active { color: #2e86c1; }
        .file-preview {
            display: none;
            flex-wrap: wrap; gap: 8px;
            padding: 8px 14px 0 14px;
            background: #fff;
        }
        .file-preview.has-files { display: flex; }
        .file-chip {
            display: flex; align-items: center; gap: 6px;
            background: #f0f4f8;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            max-width: 220px;
        }
        .file-chip .fname {
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1;
        }
        .file-chip .fdel {
            cursor: pointer; color: #aaa;
            font-size: 14px; line-height: 1;
        }
        .file-chip .fdel:hover { color: #e74c3c; }
        .chat-img-wrap {
            margin-top: 8px;
            border-radius: 8px;
            overflow: hidden;
            max-width: 240px;
        }
        .chat-img-wrap img {
            width: 100%; height: auto;
            display: block;
            border-radius: 8px;
        }

        .welcome-msg {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .welcome-msg .icon { font-size: 48px; margin-bottom: 10px; }
        .welcome-msg h3 { font-size: 18px; color: #666; margin-bottom: 8px; }
        .welcome-msg p { font-size: 14px; line-height: 1.6; }
        .welcome-msg .tips {
            margin-top: 16px;
            text-align: left;
            background: white;
            border-radius: 12px;
            padding: 14px 18px;
        }
        .welcome-msg .tips div {
            font-size: 14px;
            padding: 6px 0;
            color: #555;
        }
    </style>
</head>
<body>

<!-- ========== 设置页 ========== -->
<div id="setupPage">
    <div class="setup-logo">🤖</div>
    <div class="setup-title">艺鸿智能助手</div>
    <div class="setup-sub">马姐的专属智能助理</div>
    <div class="setup-box">
        <label>🔑 API 密钥</label>
        <input type="password" id="apiKey" placeholder="输入你的 API Key">

        <label>🤖 模型名称</label>
        <input type="text" id="modelName" value="claude-sonnet-4-20250514" placeholder="claude-sonnet-4-20250514 等">

        <label style="margin-top:12px;font-size:13px;font-weight:600;">📡 API 提供商</label>
        <div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;">
            <label style="font-size:14px;font-weight:400;display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="radio" name="provider" value="openrouter" checked> OpenRouter
            </label>
            <label style="font-size:14px;font-weight:400;display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="radio" name="provider" value="deepseek"> DeepSeek
            </label>
            <label style="font-size:14px;font-weight:400;display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="radio" name="provider" value="custom"> 自定义
            </label>
        </div>
        <div id="customUrlRow" style="display:none;margin-top:8px;">
            <label style="font-size:13px;">API 地址</label>
            <input type="text" id="customApiUrl" value="https://xiaoma.best/v1" placeholder="https://xxx.com/v1">
        </div>

        <button class="setup-btn" onclick="startChat()">💬 开始聊天</button>
        <button class="setup-btn" type="button" style="background:#95a5a6;margin-top:8px;font-size:14px;" onclick="clearHistory();return false;">🗑️ 清除聊天记录</button>
        <button class="setup-btn" id="learnBtn" type="button" style="background:#27ae60;margin-top:8px;font-size:14px;" onclick="startLearning();return false;">📊 智能学习 · 分析行业数据</button>
        <div id="learningResult" style="display:none;margin-top:12px;background:#f8f9fa;border-radius:10px;padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto;border:1px solid #e8e8e8;"></div>
        <button id="exportBtn" type="button" class="setup-btn" style="display:none;margin-top:8px;font-size:14px;background:#8e44ad;" onclick="exportLearningData()">💾 导出数据到 D 盘</button>
        <div class="setup-tip">
            🔑 API Key 只保存在你的手机浏览器中，不会上传到任何服务器<br>
            💡 选「自定义」可接入任意 OpenAI 兼容 API（如 Claude）
        </div>
    </div>
</div>

<!-- ========== 聊天页 ========== -->
<div id="chatPage">
    <div class="chat-header">
        <div class="avatar">🧮</div>
        <div class="info">
            <h2>小艺</h2>
            <p>在线 · 随时为您服务</p>
        </div>
        <button class="settings-btn" onclick="showSettings()">⚙️</button>
    </div>

    <div class="messages" id="messageList">
        <div class="welcome-msg" id="welcomeMsg">
            <div class="icon">👋</div>
            <h3>马姐，您好！</h3>
            <p>我是小艺，有什么需要帮忙的尽管说~</p>
            <div class="tips">
                <div>📌 试试问我：</div>
                <div>"帮我算个60㎡展台的报价"</div>
                <div>"客户说贵了，帮我写个回复"</div>
                <div>"帮我写一份展会通知"</div>
            </div>
        </div>
    </div>
    <div class="file-preview" id="filePreview"></div>
    <input type="file" id="fileInput" accept="image/*,.txt,.csv,.json,.md,.pdf" multiple style="display:none">

    <div class="input-area">
        <button class="upload-btn" id="uploadBtn" type="button" onclick="document.getElementById('fileInput').click()">📎</button>
        <textarea id="inputBox" rows="1" placeholder="想问什么直接说..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
/* ========== 状态 ========== */
let messages = [];      // 聊天记录 [{ role, content, timestamp }]
let isSending = false;
const HISTORY_KEY = 'yihong_chat_history';
const MAX_HISTORY = 100;
const CONVERSATION_LOG_KEY = 'yihong_conversation_log';
const INSIGHTS_KEY = 'yihong_insights';
const MAX_LOG = 500;

/* ========== 本地存储 ========== */
const STORAGE_KEY = 'yihong_quote_config';

function loadConfig() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const config = JSON.parse(saved);
            document.getElementById('apiKey').value = config.apiKey || '';
            document.getElementById('modelName').value = config.model || 'claude-sonnet-4-20250514';
            // 恢复提供商选择
            const provider = config.provider || 'openrouter';
            const radio = document.querySelector('input[name="provider"][value="' + provider + '"]');
            if (radio) radio.checked = true;
            if (config.customUrl) {
                document.getElementById('customApiUrl').value = config.customUrl;
            }
            toggleCustomUrl();
        }
    } catch(e) {}
}

function saveConfig() {
    const provider = document.querySelector('input[name="provider"]:checked');
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        apiKey: document.getElementById('apiKey').value,
        model: document.getElementById('modelName').value,
        provider: provider ? provider.value : 'openrouter',
        customUrl: document.getElementById('customApiUrl').value
    }));
}

function toggleCustomUrl() {
    const sel = document.querySelector('input[name="provider"]:checked');
    const row = document.getElementById('customUrlRow');
    row.style.display = (sel && sel.value === 'custom') ? 'block' : 'none';
    // 切换时推荐对应的模型名
    const modelInput = document.getElementById('modelName');
    if (sel) {
        const suggestions = {
            openrouter: 'gpt-4o-mini',
            deepseek: 'deepseek-chat',
            custom: 'claude-sonnet-4-20250514'
        };
        // 只在当前值是默认值时自动切换
        const current = modelInput.value;
        const defaults = ['gpt-4o-mini', 'deepseek-chat', 'claude-sonnet-4-20250514'];
        if (defaults.includes(current) || !current) {
            modelInput.value = suggestions[sel.value] || current;
        }
    }
}

// 监听提供商切换
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input[name="provider"]').forEach(function(r) {
        r.addEventListener('change', toggleCustomUrl);
    });
});

/* ========== 启动聊天 ========== */
function startChat() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) {
        alert('请输入 API Key');
        return;
    }
    saveConfig();
    document.getElementById('setupPage').classList.add('hidden');
    document.getElementById('chatPage').classList.add('active');
    // 加载历史聊天记录
    loadHistory();
}

function showSettings() {
    document.getElementById('chatPage').classList.remove('active');
    document.getElementById('setupPage').classList.remove('hidden');
}

/* ========== 系统提示词 ========== */
function getSystemPrompt() {
    return `你是「小艺」，马姐（陈锦灿的妻子）的专属智能工作助理。
你的任务是直接帮马姐**完成工作**——她说什么你直接做，不要教她步骤，不要反问"要不要我帮你"。
马姐年龄偏大，对电脑手机操作不太熟练，所以你做事要干脆利落，给她完整可用的结果。

## 沟通风格
- 叫她「马姐」，语气亲切温和，像女儿帮妈妈一样
- 说话简洁直接，不要长篇大论
- 重要信息用 emoji 标注 📌，数字和价格要清晰醒目
- 如果她问的不清楚，直接给几个选项让她选，不要一直追问

## 你的能力范围
1. **报价算价** — 根据公司价格库直接算好完整报价，含税总价
2. **写文案** — 客户回复、展会通知、合同条款、微信消息等，写完她复制就能用
3. **整理信息** — 帮她梳理客户需求、列清单、做对比
4. **解答问题** — 展览行业知识、办公软件问题、日常工作中遇到的疑问
5. **处理文件** — 她上传图片/文档，帮她读取内容、提取信息、总结要点
6. **出主意** — 客户沟通策略、展台方案建议、材料选择建议
——总之，工作上任何问题都可以问你，你直接帮她搞定

## 公司信息
- 公司：厦门市艺鸿会议展览服务有限公司
- 成立：2006年
- 联系人：陈锦灿
- 电话/微信：13850000033
- 地址：厦门市思明区明发国际新城15号701
- 税点：6%，报价有效期15天
- 付款：合同签订后预付50%，验收合格后付清尾款

## 价格数据库（36项）
地面类：木质地台18厘80元/㎡、15厘65元/㎡、钢结构120元/㎡、玻璃180元/㎡、地毯20元/㎡
接待台：简约500元/米、造型800元/米、烤漆1100元/米
墙面：形象墙350元/㎡、展示背板280元/㎡、储物柜450元/米、隔断墙200元/㎡、造型结构2000元/项、桁架35元/米、包柱600元/根
装饰：烤漆玻璃250元/㎡、拉布灯箱320元/㎡、软膜灯箱400元/㎡、PVC字3元/cm、亚克力字5元/cm、发光字8元/cm、UV喷印80元/㎡、车贴40元/㎡
家具：洽谈桌80元/张、洽谈椅50元/把、高脚桌100元/张、吧台椅60元/把、资料架80元/个、垃圾桶30元/个、绿植60元/盆、吧台凳55元/把、展示矮柜300元/米、展示高柜500元/米、旋转展台1500元/套
电工：LED射灯45元/个、LED灯带30元/米
运输：运输费1500元/项、管理费800元/项

## 报价计算规则
单项金额 = 数量 × 单价
小计 = 所有单项金额之和
税点 = 小计 × 6%
含税总价 = 小计 + 税点

## 地区报价调整
- 厦门本地：按标准价
- 福建省内（除厦门）：标准价 × 1.05
- 省外（非一线）：标准价 × 1.10
- 一线城市（北上广深）：标准价 × 1.15~1.20
- 偏远地区：标准价 × 1.20~1.30

## 报价特别说明
当马姐让你写报价或算价格时，直接算好完整的给她，格式清晰，包含项目清单、小计、税和总价。
涉及大金额时提醒她「建议和工厂确认一下」。${getInsightContext()}`;
}

/* ========== 发送消息 ========== */
async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text && selectedFiles.length === 0) return;
    if (isSending) return;

    // 复制并清空文件列表
    const currentFiles = selectedFiles.slice();
    selectedFiles = [];
    renderFileChips();

    input.value = '';
    autoResize(input);

    // 显示用户消息（含图片预览）
    let displayText = text || '📎 发送了文件';
    let extraHtml = '';
    const imageFiles = currentFiles.filter(function(f) { return f.type === 'image'; });
    if (imageFiles.length > 0) {
        extraHtml = imageFiles.map(function(f) {
            return '<div class="chat-img-wrap"><img src="' + f.dataUrl + '" alt="图片" loading="lazy"></div>';
        }).join('');
    }
    addMessage(displayText, 'user', extraHtml);

    isSending = true;
    document.getElementById('sendBtn').disabled = true;

    showTyping();

    try {
        const reply = await callAPI(text, currentFiles);
        hideTyping();
        addMessage(reply, 'bot');
        // 自动记录对话到行业数据
        recordConversation(text, reply);
    } catch(err) {
        hideTyping();
        const msg = err.message + '';
        let hint = '您检查一下 API Key 有没有填对？';
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS')) {
            hint = '这是浏览器的跨域限制问题。\n✅ 解决办法：勾选「使用 OpenRouter」再试\n🔑 去 openrouter.ai/keys 免费申请 Key';
        } else if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid')) {
            hint = 'API Key 填错了，请检查有没有复制完整（包含 sk- 开头）';
        }
        addMessage('😅 小艺出了点问题：\n' + hint, 'bot');
    }

    isSending = false;
    document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

/* ========== 消息气泡 ========== */
function renderMessageToDOM(text, role, extraHtml) {
    const welcome = document.getElementById('welcomeMsg');
    if (welcome) welcome.style.display = 'none';

    const list = document.getElementById('messageList');
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = role === 'user' ? '👤' : '🧮';
    let bubbleContent = escapeHtml(text);
    if (extraHtml) bubbleContent += extraHtml;
    div.innerHTML = `
        <div class="avatar-icon">${avatar}</div>
        <div class="bubble">${bubbleContent}</div>
    `;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

function addMessage(text, role, extraHtml) {
    renderMessageToDOM(text, role, extraHtml);
    // 保存到聊天记录（不含图片，只存文字）
    if (!extraHtml) {
        messages.push({ role, content: text, timestamp: Date.now() });
        saveHistory();
    }
}

function saveHistory() {
    try {
        if (messages.length > MAX_HISTORY) {
            messages = messages.slice(-MAX_HISTORY);
        }
        localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
    } catch(e) { /* localStorage 满了就算了 */ }
}

function loadHistory() {
    try {
        const saved = localStorage.getItem(HISTORY_KEY);
        if (saved) {
            messages = JSON.parse(saved);
            for (const msg of messages) {
                renderMessageToDOM(msg.content, msg.role);
            }
            return messages.length > 0;
        }
    } catch(e) {}
    return false;
}

function clearHistory() {
    if (messages.length === 0) return;
    if (!confirm('确定清除所有聊天记录吗？')) return;
    messages = [];
    localStorage.removeItem(HISTORY_KEY);
    const list = document.getElementById('messageList');
    list.innerHTML = '<div class="welcome-msg" id="welcomeMsg">\n            <div class="icon">👋</div>\n            <h3>马姐，您好！</h3>\n            <p>我是小艺，有什么需要帮忙的尽管说~</p>\n            <div class="tips">\n                <div>📌 试试问我：</div>\n                <div>"帮我算个60㎡展台的报价"</div>\n                <div>"客户说贵了，帮我写个回复"</div>\n                <div>"帮我写一份展会通知"</div>\n            </div>\n        </div>';
}

/* ========== 数据记录 & 行业学习 ========== */
function recordConversation(userMsg, botReply) {
    if (!userMsg || !botReply) return;
    try {
        var log = [];
        var saved = localStorage.getItem(CONVERSATION_LOG_KEY);
        if (saved) log = JSON.parse(saved);
        log.push({
            time: new Date().toISOString(),
            ask: userMsg,
            reply: botReply.substring(0, 500)
        });
        if (log.length > MAX_LOG) log = log.slice(-MAX_LOG);
        localStorage.setItem(CONVERSATION_LOG_KEY, JSON.stringify(log));
    } catch(e) {}
}

function getInsightContext() {
    try {
        var saved = localStorage.getItem(INSIGHTS_KEY);
        if (saved) {
            var insights = JSON.parse(saved);
            if (insights && insights.content) {
                return '\n\n## 从历史对话中学习的行业经验\n以下是 AI 分析马姐对话后总结的行业经验，你在回答时应该参考这些：\n\n' + insights.content + '\n\n（来源：最近' + insights.conversationCount + '条对话的智能分析）';
            }
        }
    } catch(e) {}
    return '';
}

async function startLearning() {
    var logStr = localStorage.getItem(CONVERSATION_LOG_KEY);
    if (!logStr) { alert('还没有对话记录，先用一段时间再来~'); return; }
    var log = JSON.parse(logStr);
    if (log.length < 5) { alert('对话还不够多（至少需要 5 条），再用用再来~'); return; }

    var btn = document.getElementById('learnBtn');
    var resultDiv = document.getElementById('learningResult');
    if (!btn || !resultDiv) return;

    btn.textContent = '⏳ 正在分析中...';
    btn.disabled = true;
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<em>⏳ AI 正在分析 ' + log.length + ' 条对话，请稍等...</em>';

    var recent = log.slice(-50);
    var convText = '';
    for (var i = 0; i < recent.length; i++) {
        convText += '问：' + recent[i].ask + '\n答：' + recent[i].reply + '\n---\n';
    }

    var analyzePrompt = '请分析以下展览行业客户对话记录，提取：\n\n1. **高频问题**（客户/马姐反复问到的事）\n2. **客户痛点**（客户在意什么、反复担心的点）\n3. **报价规律**（不同地区/类型有什么价格变化趋势）\n4. **助手改进建议**（小艺哪里答得不够好，应该怎么改进）\n5. **行业关键词**（5-10个当前最常涉及的关键词）\n\n对话记录：\n' + convText + '\n请用中文输出，分点清晰，适合直接给马姐阅读。';

    try {
        var insights = await callAPIRaw(
            '你是一个展览行业数据分析师。你的任务是从客户对话中提取有价值的行业洞察。',
            analyzePrompt
        );
        localStorage.setItem(INSIGHTS_KEY, JSON.stringify({
            time: new Date().toISOString(),
            content: insights,
            conversationCount: recent.length
        }));
        resultDiv.innerHTML = '<strong>📊 分析完成！</strong>（基于最近 ' + recent.length + ' 条对话）\n\n' + insights;
        document.getElementById('exportBtn').style.display = 'block';
    } catch(e) {
        resultDiv.innerHTML = '<span style="color:#e74c3c;">❌ 分析失败：' + e.message + '</span>';
    }
    btn.textContent = '📊 智能学习 · 分析行业数据';
    btn.disabled = false;
}

async function callAPIRaw(systemPrompt, userPrompt) {
    var apiKey = document.getElementById('apiKey').value.trim();
    var model = document.getElementById('modelName').value.trim() || 'claude-sonnet-4-20250514';
    var provider = document.querySelector('input[name="provider"]:checked');
    var useOpenRouter = provider && provider.value === 'openrouter';
    var useDeepSeek = provider && provider.value === 'deepseek';

    var url, headers;
    if (useOpenRouter) {
        url = 'https://openrouter.ai/api/v1/chat/completions';
        headers = { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.origin, 'X-Title': '艺鸿助手' };
    } else if (useDeepSeek) {
        url = 'https://api.deepseek.com/v1/chat/completions';
        headers = { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' };
    } else {
        var baseUrl = document.getElementById('customApiUrl').value.trim();
        if (!baseUrl) baseUrl = 'https://xiaoma.best/v1';
        if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
        url = baseUrl + '/chat/completions';
        headers = { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' };
    }

    var body = {
        model: model,
        messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userPrompt }
        ],
        max_tokens: 2048,
        temperature: 0.5
    };

    var resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) });
    if (!resp.ok) {
        var errText = await resp.text();
        throw new Error('API ' + resp.status + ': ' + errText.substring(0, 200));
    }
    var data = await resp.json();
    return data.choices[0].message.content;
}

async function exportLearningData() {
    var logStr = localStorage.getItem(CONVERSATION_LOG_KEY);
    var insightsStr = localStorage.getItem(INSIGHTS_KEY);

    var md = '# 艺鸿行业数据报告\n';
    md += '> 导出时间：' + new Date().toLocaleString('zh-CN') + '\n';
    md += '> 公司：厦门市艺鸿会议展览服务有限公司\n\n---\n\n';

    if (insightsStr) {
        var insights = JSON.parse(insightsStr);
        md += '## 📊 最新行业分析\n';
        md += '> 基于 ' + insights.conversationCount + ' 条对话 | 分析时间：' + new Date(insights.time).toLocaleString('zh-CN') + '\n\n';
        md += insights.content + '\n\n---\n\n';
    }

    if (logStr) {
        var log = JSON.parse(logStr);
        md += '## 💬 对话记录（共 ' + log.length + ' 条）\n\n';
        for (var i = log.length - 1; i >= 0; i--) {
            var entry = log[i];
            md += '### ' + new Date(entry.time).toLocaleString('zh-CN') + '\n';
            md += '**马姐问：** ' + entry.ask + '\n\n';
            md += '**小艺答：** ' + entry.reply + '\n\n---\n\n';
        }
    }

    var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    var filename = '艺鸿行业数据_' + new Date().toISOString().slice(0,10) + '.md';

    try {
        var handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
        });
        var writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        alert('✅ 已保存！建议放到 D:\\艺鸿行业数据\\ 文件夹');
    } catch(e) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() {
            alert('💡 文件已下载！请移动到 D:\\艺鸿行业数据\\ 文件夹中保存');
        }, 500);
    }
}

function hideTyping() {

/* ========== API 调用 ========== */
async function callAPI(userMessage, files) {
    files = files || [];
    const apiKey = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelName').value.trim() || 'claude-sonnet-4-20250514';
    const provider = document.querySelector('input[name="provider"]:checked');
    const useOpenRouter = provider && provider.value === 'openrouter';
    const useDeepSeek = provider && provider.value === 'deepseek';
    const useCustom = provider && provider.value === 'custom';

    // 构建消息历史
    const history = [];
    const msgDivs = document.querySelectorAll('.msg:not(.typing) .bubble');
    msgDivs.forEach(b => {
        const parent = b.closest('.msg');
        const role = parent.classList.contains('user') ? 'user' : 'assistant';
        const content = b.textContent;
        if (content.trim()) {
            history.push({ role, content });
        }
    });

    const systemMsg = { role: 'system', content: getSystemPrompt() };

    // 构建用户消息（含文件附件）
    const textFiles = files.filter(function(f) { return f.type === 'text'; });
    const imageFiles = files.filter(function(f) { return f.type === 'image'; });

    let messageText = userMessage || '';
    if (textFiles.length > 0) {
        const sections = textFiles.map(function(f) {
            return '【文件：' + f.file.name + '】\n' + f.content;
        });
        const prefix = '我上传了以下文件内容，请参考：\n\n' + sections.join('\n\n---\n\n');
        messageText = prefix + (userMessage ? '\n\n我的问题是：' + userMessage : '');
    }

    let userMsg;
    if (imageFiles.length > 0) {
        const contentParts = [];
        if (messageText) contentParts.push({ type: 'text', text: messageText });
        imageFiles.forEach(function(f) {
            contentParts.push({ type: 'image_url', image_url: { url: f.dataUrl } });
        });
        userMsg = { role: 'user', content: contentParts };
    } else {
        userMsg = { role: 'user', content: messageText };
    }

    let url, headers, body;

    if (useOpenRouter) {
        url = 'https://openrouter.ai/api/v1/chat/completions';
        headers = {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': '艺鸿报价助手'
        };
    } else if (useDeepSeek) {
        url = 'https://api.deepseek.com/v1/chat/completions';
        headers = {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json'
        };
    } else {
        // 自定义 API（如 Claude 第三方代理）
        let baseUrl = document.getElementById('customApiUrl').value.trim();
        if (!baseUrl) baseUrl = 'https://xiaoma.best/v1';
        if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
        url = baseUrl + '/chat/completions';
        headers = {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json'
        };
    }

    body = {
        model: model,
        messages: [systemMsg, ...history, userMsg],
        max_tokens: 2048,
        temperature: 0.7
    };

    const resp = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
    });

    if (!resp.ok) {
        const errText = await resp.text();
        throw new Error('API 错误 (' + resp.status + '): ' + errText);
    }

    const data = await resp.json();
    return data.choices[0].message.content;
}

/* ========== 工具函数 ========== */
function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
}

/* ========== 文件上传 ========== */
let selectedFiles = [];

document.getElementById('fileInput').addEventListener('change', function(e) {
    for (const file of e.target.files) {
        if (file.size > 5 * 1024 * 1024) {
            alert('文件太大（超过5MB），请选择小一点的文件');
            continue;
        }
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                selectedFiles.push({ file, dataUrl: ev.target.result, type: 'image' });
                renderFileChips();
            };
            reader.readAsDataURL(file);
        } else if (file.type.startsWith('text/') || /\.(txt|csv|json|md|xml|log|js|py|html|css)$/i.test(file.name)) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                selectedFiles.push({ file, content: ev.target.result, type: 'text' });
                renderFileChips();
            };
            reader.readAsText(file);
        } else {
            alert('不支持的文件类型：' + file.name + '\n（仅支持图片和文本文件）');
            continue;
        }
    }
    this.value = '';
});

function renderFileChips() {
    const el = document.getElementById('filePreview');
    if (!selectedFiles.length) {
        el.className = 'file-preview';
        el.innerHTML = '';
        return;
    }
    el.className = 'file-preview has-files';
    el.innerHTML = selectedFiles.map(function(f, i) {
        const icon = f.type === 'image' ? '🖼️' : '📄';
        return '<div class="file-chip">' +
            '<span>' + icon + '</span>' +
            '<span class="fname">' + f.file.name + '</span>' +
            '<span class="fdel" onclick="removeFile('+i+')">✕</span>' +
            '</div>';
    }).join('');
}

function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderFileChips();
}

/* ========== 初始化 ========== */
loadConfig();
