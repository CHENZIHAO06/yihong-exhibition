<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小艺 · 艺鸿报价助手</title>
    <style>
        /* ========== 全局重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f0f0;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== 设置页 ========== */
        #setupPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            background: linear-gradient(135deg, #0e2f44, #1a5276);
            color: white;
        }
        #setupPage.hidden { display: none; }
        .setup-logo {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .setup-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .setup-sub {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .setup-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            color: #333;
        }
        .setup-box label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 16px;
        }
        .setup-box label:first-child { margin-top: 0; }
        .setup-box input, .setup-box textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .setup-box input:focus, .setup-box textarea:focus {
            border-color: #2e86c1;
            box-shadow: 0 0 0 3px rgba(46,134,193,0.15);
        }
        .setup-box textarea { height: 100px; resize: vertical; font-size: 13px; }
        .setup-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        .setup-btn:active { opacity: 0.8; }
        .setup-tip {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 12px;
            line-height: 1.6;
        }
        .setup-tip a { color: #2e86c1; }

        /* ========== 聊天页 ========== */
        #chatPage { display: none; flex-direction: column; height: 100vh; }
        #chatPage.active { display: flex; }

        /* 顶部栏 */
        .chat-header {
            background: linear-gradient(135deg, #0e2f44, #1a5276);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-header .avatar {
            width: 40px; height: 40px;
            background: #e67e22;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .chat-header .info { flex: 1; }
        .chat-header .info h2 { font-size: 17px; font-weight: 600; }
        .chat-header .info p { font-size: 12px; opacity: 0.7; }
        .chat-header .settings-btn {
            background: none; border: none; color: white;
            font-size: 24px; cursor: pointer; padding: 4px;
        }

        /* 消息区 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot { align-self: flex-start; }

        .msg .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user .bubble {
            background: #2e86c1;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.bot .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .msg .avatar-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }
        .msg.user .avatar-icon { background: #1a5276; }
        .msg.bot .avatar-icon { background: #e67e22; }

        .typing .bubble {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 16px 20px;
        }
        .typing .dot {
            width: 8px; height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* 输入区 */
        .input-area {
            padding: 12px 14px;
            background: white;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            padding: 8px 0;
            max-height: 100px;
            resize: none;
            line-height: 1.5;
        }
        .input-area .send-btn {
            width: 44px; height: 44px;
            background: #2e86c1;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .input-area .send-btn:disabled { opacity: 0.4; }
        .input-area .send-btn:active { transform: scale(0.95); }

        .welcome-msg {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .welcome-msg .icon { font-size: 48px; margin-bottom: 10px; }
        .welcome-msg h3 { font-size: 18px; color: #666; margin-bottom: 8px; }
        .welcome-msg p { font-size: 14px; line-height: 1.6; }
        .welcome-msg .tips {
            margin-top: 16px;
            text-align: left;
            background: white;
            border-radius: 12px;
            padding: 14px 18px;
        }
        .welcome-msg .tips div {
            font-size: 14px;
            padding: 6px 0;
            color: #555;
        }
    </style>
</head>
<body>

<!-- ========== 设置页 ========== -->
<div id="setupPage">
    <div class="setup-logo">🧮</div>
    <div class="setup-title">艺鸿报价助手</div>
    <div class="setup-sub">马姐的专属智能助理</div>
    <div class="setup-box">
        <label>🔑 API 密钥</label>
        <input type="password" id="apiKey" placeholder="输入你的 API Key">

        <label>🤖 模型选择</label>
        <input type="text" id="modelName" value="deepseek-chat" placeholder="deepseek-chat 或 gpt-4o-mini 等">

        <label style="margin-top:8px;font-size:12px;color:#999;">
            <input type="checkbox" id="useOpenRouter" checked> ✅ 推荐：使用 OpenRouter（浏览器兼容性最好）
        </label>

        <button class="setup-btn" onclick="startChat()">💬 开始聊天</button>
        <div class="setup-tip">
            API Key 只保存在你的手机浏览器中，不会上传到任何服务器<br><br>
            📌 <strong>推荐用 OpenRouter</strong>：浏览器直接可用，支持 DeepSeek<br>
            🔑 <a href="https://openrouter.ai/keys" target="_blank">获取 OpenRouter Key →</a><br>
            ❌ DeepSeek 官方 API 在浏览器可能被拦截，<strong>取消勾选即可尝试</strong>
        </div>
    </div>
</div>

<!-- ========== 聊天页 ========== -->
<div id="chatPage">
    <div class="chat-header">
        <div class="avatar">🧮</div>
        <div class="info">
            <h2>小艺</h2>
            <p>在线 · 艺鸿报价助手</p>
        </div>
        <button class="settings-btn" onclick="showSettings()">⚙️</button>
    </div>

    <div class="messages" id="messageList">
        <div class="welcome-msg" id="welcomeMsg">
            <div class="icon">👋</div>
            <h3>马姐，您好！</h3>
            <p>我是小艺，有什么需要帮忙的尽管说~</p>
            <div class="tips">
                <div>📌 试试问我：</div>
                <div>"查一下木质地台的价格"</div>
                <div>"算个60㎡展台大概多少钱"</div>
                <div>"客户说贵了，帮我写个回复"</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="inputBox" rows="1" placeholder="想问什么直接说..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
/* ========== 状态 ========== */
let messages = [];
let isSending = false;

/* ========== 本地存储 ========== */
const STORAGE_KEY = 'yihong_quote_config';

function loadConfig() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const config = JSON.parse(saved);
            document.getElementById('apiKey').value = config.apiKey || '';
            document.getElementById('modelName').value = config.model || 'deepseek-chat';
            document.getElementById('useOpenRouter').checked = config.useOpenRouter !== false;
        }
    } catch(e) {}
}

function saveConfig() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        apiKey: document.getElementById('apiKey').value,
        model: document.getElementById('modelName').value,
        useOpenRouter: document.getElementById('useOpenRouter').checked
    }));
}

/* ========== 启动聊天 ========== */
function startChat() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) {
        alert('请输入 API Key');
        return;
    }
    saveConfig();
    document.getElementById('setupPage').classList.add('hidden');
    document.getElementById('chatPage').classList.add('active');
}

function showSettings() {
    document.getElementById('chatPage').classList.remove('active');
    document.getElementById('setupPage').classList.remove('hidden');
}

/* ========== 系统提示词 ========== */
function getSystemPrompt() {
    return `你是「小艺」，厦门市艺鸿会议展览服务有限公司的智能报价助手。
你的用户是马姐（陈锦灿的妻子），年龄偏大。
你的任务是直接帮她完成工作，她说什么你直接做，不要教她步骤。

## 沟通风格
- 叫她「马姐」，说话亲切温和简洁
- 价格数字要清晰，重要信息用 emoji 标注
- 她问什么你直接做完给她，不要反问"要不要我帮你"

## 公司信息
- 公司：厦门市艺鸿会议展览服务有限公司
- 电话/微信：13850000033
- 地址：厦门市思明区明发国际新城15号701
- 税点：6%，报价有效期15天
- 付款：预付50%，验收后付清

## 价格数据库（36项）
地面类：木质地台18厘80元/㎡、15厘65元/㎡、钢结构120元/㎡、玻璃180元/㎡、地毯20元/㎡
接待台：简约500元/米、造型800元/米、烤漆1100元/米
墙面：形象墙350元/㎡、展示背板280元/㎡、储物柜450元/米、隔断墙200元/㎡、造型结构2000元/项、桁架35元/米、包柱600元/根
装饰：烤漆玻璃250元/㎡、拉布灯箱320元/㎡、软膜灯箱400元/㎡、PVC字3元/cm、亚克力字5元/cm、发光字8元/cm、UV喷印80元/㎡、车贴40元/㎡
家具：洽谈桌80元/张、洽谈椅50元/把、高脚桌100元/张、吧台椅60元/把、资料架80元/个、垃圾桶30元/个、绿植60元/盆、吧台凳55元/把、展示矮柜300元/米、展示高柜500元/米、旋转展台1500元/套
电工：LED射灯45元/个、LED灯带30元/米
运输：运输费1500元/项、管理费800元/项

## 报价规则
- 金额=数量×单价，小计=∑金额，税=小计×6%，总价=小计+税
- 厦门本地标准价；福建省内×1.05；省外×1.10；一线城市×1.15~1.20

当马姐让你写报价或算价格时，直接算好完整的给她。`;
}

/* ========== 发送消息 ========== */
async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text || isSending) return;

    input.value = '';
    autoResize(input);
    addMessage(text, 'user');
    isSending = true;
    document.getElementById('sendBtn').disabled = true;

    // 显示打字中
    showTyping();

    try {
        const reply = await callAPI(text);
        hideTyping();
        addMessage(reply, 'bot');
    } catch(err) {
        hideTyping();
        const msg = err.message + '';
        let hint = '您检查一下 API Key 有没有填对？';
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS')) {
            hint = '这是浏览器的跨域限制问题。\n✅ 解决办法：勾选「使用 OpenRouter」再试\n🔑 去 openrouter.ai/keys 免费申请 Key';
        } else if (msg.includes('401') || msg.includes('unauthorized') || msg.includes('invalid')) {
            hint = 'API Key 填错了，请检查有没有复制完整（包含 sk- 开头）';
        }
        addMessage('😅 小艺出了点问题：\n' + hint, 'bot');
    }

    isSending = false;
    document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

/* ========== 消息气泡 ========== */
function addMessage(text, role) {
    const welcome = document.getElementById('welcomeMsg');
    if (welcome) welcome.style.display = 'none';

    const list = document.getElementById('messageList');
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = role === 'user' ? '👤' : '🧮';
    div.innerHTML = `
        <div class="avatar-icon">${avatar}</div>
        <div class="bubble">${escapeHtml(text)}</div>
    `;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

function showTyping() {
    const list = document.getElementById('messageList');
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.id = 'typingIndicator';
    div.innerHTML = `
        <div class="avatar-icon">🧮</div>
        <div class="bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    `;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

/* ========== API 调用 ========== */
async function callAPI(userMessage) {
    const apiKey = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelName').value.trim() || 'deepseek-chat';
    const useOpenRouter = document.getElementById('useOpenRouter').checked;

    // 构建消息历史
    const history = [];
    const msgDivs = document.querySelectorAll('.msg:not(.typing) .bubble');
    msgDivs.forEach(b => {
        const parent = b.closest('.msg');
        const role = parent.classList.contains('user') ? 'user' : 'assistant';
        history.push({ role, content: b.textContent });
    });

    const systemMsg = { role: 'system', content: getSystemPrompt() };

    let url, headers, body;

    if (useOpenRouter) {
        url = 'https://openrouter.ai/api/v1/chat/completions';
        headers = {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': '艺鸿报价助手'
        };
    } else {
        // DeepSeek 官方 API
        url = 'https://api.deepseek.com/v1/chat/completions';
        headers = {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json'
        };
    }

    body = {
        model: model,
        messages: [systemMsg, ...history, { role: 'user', content: userMessage }],
        max_tokens: 2048,
        temperature: 0.7
    };

    const resp = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
    });

    if (!resp.ok) {
        const errText = await resp.text();
        throw new Error('API 错误 (' + resp.status + '): ' + errText);
    }

    const data = await resp.json();
    return data.choices[0].message.content;
}

/* ========== 工具函数 ========== */
function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
}

/* ========== 初始化 ========== */
loadConfig();
</script>
</body>
</html>
